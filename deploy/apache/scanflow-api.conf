# ScanFlow API Apache vhost — public port 7001 → Docker API backends 3000 + 3004

<VirtualHost *:7001>

    ProxyPreserveHost On
    ProxyRequests Off

    <Proxy balancer://scanflow-api>
        BalancerMember http://127.0.0.1:3000 route=api1
        BalancerMember http://127.0.0.1:3004 route=api2
        ProxySet lbmethod=byrequests
    </Proxy>

    ProxyPass /v1 balancer://scanflow-api/v1
    ProxyPassReverse /v1 balancer://scanflow-api/v1

    ErrorLog ${APACHE_LOG_DIR}/scanflow-api-error.log
    CustomLog ${APACHE_LOG_DIR}/scanflow-api-access.log combined
</VirtualHost>

# Single-replica mode (REPLICAS=1):
# ProxyPass /v1 http://127.0.0.1:3000/v1
# ProxyPassReverse /v1 http://127.0.0.1:3000/v1